version: 2
updates:

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # discord.py 2.7.1 is written against davey 0.1 and never executes davey
    # 0.2's key transitions (prepare_transition/execute_transition), so the
    # bot's voice audio is silent with 0.2. Lift this by hand in the PR that
    # moves discord.py to a release supporting davey 0.2.
    ignore:
      - dependency-name: "davey"
        versions:
          - ">=0.2.0"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # The bot's Python version moves deliberately, everywhere at once
    # (Dockerfile, CI, .python-version), never by a Dependabot PR.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # The bgutil image tag follows the bgutil-ytdlp-pot-provider pin, which
    # the uv ecosystem bumps; it is set by hand in that PR. A lone compose
    # PR would fail the tag-equality test.
    ignore:
      - dependency-name: "brainicism/bgutil-ytdlp-pot-provider"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
