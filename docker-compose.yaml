services:
  doybot:
    container_name: doybot
    build: .
    image: doybot:latest
    restart: unless-stopped
    # Every bot setting comes from .env, read at run time and injected
    # into the container.
    #
    # This replaces the per-variable `environment:` list that used to
    # be here. Compose interpolates an unset ${VAR} to the empty string
    # and then *sets* it, which is not the same as leaving it unset:
    # config.get_env_var() type-checks the value against the Config
    # class default, so an empty string either fails startup outright
    # for any non-str setting (ENABLE_LOCAL_LIBRARY, VC_TIMEOUT,
    # MAX_SONG_PRELOAD, ...) or silently changes behaviour for a str
    # one (BOT_PREFIX= disables text commands). Enumerating the
    # settings also meant new ones were simply missed - LASTFM_API_KEY
    # and EXTRA_OWNERS never reached the container at all.
    #
    # With env_file, a setting absent from .env is absent in the
    # container too, and the Config default applies.
    #
    # .env is deliberately kept out of the image (see .dockerignore) -
    # it holds BOT_TOKEN, and is supplied here at run time instead.
    env_file:
      - .env
    environment:
      # Container-side overrides, applied on top of env_file, for
      # settings whose .env value describes the *host*.
      #
      # MUSIC_LIBRARY_PATH in .env is a host path (F:/Music); inside
      # the container the library is always at the read-only mount
      # below, so the host value must not be passed through.
      - MUSIC_LIBRARY_PATH=/music
      # Default the database into the mounted ./data directory, so a
      # deployment that sets nothing still keeps it on the host rather
      # than in the container layer. A DATABASE_URL set in .env still
      # wins - which is what a postgres/mysql deployment needs - so if
      # you keep sqlite there, point it inside data/ as well or the
      # file lands in the container and is lost on the next recreate.
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/settings.db}
    volumes:
      - backup:/app/backup
      # A directory, not the database file itself. Docker creates a
      # missing bind-mount source as a *directory*, so mounting
      # ./settings.db directly meant a first run on a fresh clone -
      # settings.db is gitignored and never present - produced a
      # directory where the database should be, and sqlite failed with
      # a bare "unable to open database file". Mounting the directory
      # also keeps sqlite's journal beside the database on the host
      # instead of in the container, and lets a backup be restored by
      # renaming a file (a file bind mount pins the inode, so the
      # container would keep using the replaced one).
      - ./data:/app/data
      # cookies.txt is excluded from the image by .dockerignore - it is
      # a credential file once filled in - so mount it back in, or
      # restricted-content playback silently loses its cookies (yt-dlp
      # skips an unreadable cookiefile rather than failing).
      - ./config/cookies:/app/config/cookies:ro
      # Host path to the music library. Set MUSIC_LIBRARY_HOST_PATH in
      # .env to point this somewhere else; the default preserves the
      # path this file used to hardcode. (The bot warns about
      # MUSIC_LIBRARY_HOST_PATH as an unknown variable when run
      # outside Docker - it is read by Compose, not by the bot.)
      - ${MUSIC_LIBRARY_HOST_PATH:-F:/Music}:/music:ro
    networks:
      - bridge
    depends_on:
      bgutil-provider:
        condition: service_started
  bgutil-provider:
    container_name: bgutil-provider
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "4416:4416"
    networks:
      - bridge
volumes:
  backup:
networks:
  bridge:
    driver: bridge
