[project]
name = "doybot-music"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aioconsole==0.9.0",
    "aiohttp~=3.14.5",
    "aiosqlite==0.22.1",
    "alembic~=1.20.1",
    "beautifulsoup4==4.15.0",
    "bgutil-ytdlp-pot-provider==2.0.2",
    "davey~=0.1.7",
    "discord-py[voice]==2.7.1",
    "json-with-comments==1.3.0",
    "mutagen==1.48.1",
    "packaging~=26.3",
    "python-dotenv~=1.2.4",
    "requests==2.34.2",
    "spotipy==2.26.0",
    "sqlalchemy[asyncio]~=2.1.8",
    "urllib3==2.8.0",
    "yt-dlp[default]~=2026.10.26",
]

[project.optional-dependencies]
# extra async DB drivers for DATABASE_URL — sqlite (aiosqlite) is a
# default dependency above; install one of these to use a different DB
postgres = ["asyncpg==0.32.0"]
mysql = ["aiomysql==0.3.2"]

[dependency-groups]
dev = ["pre-commit==4.7.0", "pytest==9.2.0", "pyyaml==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the bot imports discord.py and yt-dlp at module scope, which emit
# their own deprecation noise; -q keeps a failure visible in it
addopts = "-q"
