[project]
name = "doybot-music"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aioconsole==0.8.2",
    "aiohttp~=3.14.3",
    "aiosqlite==0.22.1",
    "alembic~=1.19.1",
    "asyncio~=4.0.0",
    "beautifulsoup4==4.15.0",
    "bgutil-ytdlp-pot-provider==1.3.1",
    "davey~=0.1.6",
    "discord-py[voice]==2.7.1",
    "json-with-comments==1.2.10",
    "packaging~=26.3",
    "python-dotenv~=1.2.3",
    "setuptools==84.0.0",
    "spotipy==2.26.0",
    "sqlalchemy[asyncio]~=2.0.52",
    "tomli==2.4.1",
    "wheel==0.48.0",
    "yt-dlp[default]~=2026.8.19",
]

[project.optional-dependencies]
# extra async DB drivers for DATABASE_URL — sqlite (aiosqlite) is a
# default dependency above; install one of these to use a different DB
postgres = ["asyncpg==0.30.0"]
mysql = ["aiomysql==0.2.0"]

[dependency-groups]
build = ["pyinstaller==6.14.2"]
